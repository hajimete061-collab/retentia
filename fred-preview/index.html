<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1D3A" />
  <title>Fred — Would you ship this?</title>
  <style>
    :root{
      --fred-blue:#2F73F6;
      --fred-blue-dark:#174FAF;
      --fred-navy:#0B1D3A;
      --fred-ink:#10213F;
      --bg:#F5F8FC;
      --surface:#FFFFFF;
      --surface-2:#EEF4FC;
      --text:#10213F;
      --muted:#53657D;
      --line:#D7E1EE;
      --success:#146C43;
      --success-bg:#E7F6EE;
      --danger:#A63D43;
      --danger-bg:#FCEBED;
      --warning:#805B10;
      --warning-bg:#FFF6DD;
      --shadow:0 18px 46px rgba(11,29,58,.12);
      --r-lg:24px;
      --r-md:16px;
      --r-sm:12px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg);scroll-behavior:smooth;overflow-x:hidden}
    body{
      margin:0;
      min-width:0;
      min-height:100dvh;
      overflow-x:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:16px;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    button{touch-action:manipulation}
    a{color:var(--fred-blue-dark);text-underline-offset:3px}
    img{display:block;max-width:100%}
    :focus-visible{outline:3px solid rgba(47,115,246,.42);outline-offset:3px}
    .visually-hidden{
      position:absolute!important;width:1px!important;height:1px!important;
      padding:0!important;margin:-1px!important;overflow:hidden!important;
      clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;
    }
    #app{min-height:100dvh}
    .shell{
      --pad-inline:clamp(14px,4vw,20px);
      --pad-left:max(var(--pad-inline),env(safe-area-inset-left));
      --pad-right:max(var(--pad-inline),env(safe-area-inset-right));
      width:min(100%,34rem);
      min-height:100dvh;
      margin:0 auto;
      padding-top:max(clamp(16px,3dvh,22px),env(safe-area-inset-top));
      padding-right:var(--pad-right);
      padding-bottom:max(clamp(24px,4dvh,34px),env(safe-area-inset-bottom));
      padding-left:var(--pad-left);
      display:flex;
      flex-direction:column;
      gap:clamp(14px,2.5dvh,20px);
      background:var(--surface);
    }
    body.title-active{background:var(--fred-navy)}
    .shell.title-mode{
      width:100%;max-width:none;min-height:100dvh;margin:0;padding:0;gap:0;
      background:var(--fred-navy);border-radius:0;box-shadow:none;
    }
    .shell.title-mode>.topbar,.shell.title-mode>.progress{display:none}
    .shell.title-mode .title-screen{animation:none}
    .topbar{display:flex;align-items:center;min-height:48px;gap:clamp(4px,1.5vw,8px);min-width:0}
    .brand{display:flex;align-items:center;gap:clamp(4px,1.5vw,7px);text-decoration:none;color:var(--text);min-width:0;flex:1}
    .brand-logo{width:clamp(72px,22vw,90px);height:auto;object-fit:contain;background:transparent;flex:0 0 auto}
    .brand-copy{line-height:1.08;min-width:0;flex:1}
    .brand-copy span{font-size:14px;color:var(--muted)}
    .brand-line{display:block;white-space:nowrap}
    .step-pill{
      margin-left:auto;min-height:34px;padding:6px 8px;border-radius:999px;
      background:var(--surface-2);color:var(--muted);font-size:14px;font-weight:700;
      display:inline-flex;align-items:center;white-space:nowrap;flex:0 0 auto;
    }
    .progress{height:5px;border-radius:999px;background:#E8EEF6;overflow:hidden}
    .progress>span{display:block;height:100%;background:var(--fred-blue);border-radius:inherit;transition:width .18s ease}
    .screen{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(14px,2.4dvh,20px);animation:enter .18s ease both}
    .hero-screen{
      margin-right:calc(-1 * var(--pad-right));
      margin-bottom:calc(-1 * max(clamp(24px,4dvh,34px),env(safe-area-inset-bottom)));
      margin-left:calc(-1 * var(--pad-left));
      padding-top:clamp(22px,4dvh,32px);
      padding-right:var(--pad-right);
      padding-bottom:max(30px,env(safe-area-inset-bottom));
      padding-left:var(--pad-left);
      background:var(--fred-navy);color:#fff
    }
    .hero-brand{display:flex;align-items:center;gap:11px}
    .hero-brand img{width:112px;height:auto;object-fit:contain;background:transparent}
    .hero-kicker,.eyebrow{
      margin:0;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    }
    .hero-kicker{color:#AFCBFF}
    .eyebrow{color:#315C94}
    .hero-screen .eyebrow,.result-card .eyebrow{color:#AFCBFF}
    h1,h2,h3,p{margin-top:0}
    h1,h2,h3{text-wrap:balance}
    p,.brief-row span,.choice-desc,.decision-note,.build-copy span,.evidence-copy,.source,.workflow p,.product-detail-copy,.product-copy strong,.product-link-hint{ text-wrap:pretty; }
    h1{font-size:clamp(2.5rem,11vw,3rem);line-height:.98;letter-spacing:-.055em;margin-bottom:14px}
    h2{font-size:clamp(1.75rem,7vw,2rem);line-height:1.05;letter-spacing:-.045em;margin-bottom:10px}
    h3{font-size:clamp(1.125rem,4.8vw,1.25rem);line-height:1.18;letter-spacing:-.025em;margin-bottom:6px}
    .lede{font-size:clamp(1rem,4vw,1.125rem);line-height:1.55;color:var(--muted);margin-bottom:0}
    .hero-screen .lede{color:#D9E6FB}
    .title-screen{position:relative;overflow:hidden;justify-content:space-between;background:var(--fred-navy);color:#fff;min-height:100dvh;padding-top:max(clamp(28px,8dvh,64px),env(safe-area-inset-top));padding-right:max(var(--pad-inline),env(safe-area-inset-right));padding-bottom:max(28px,env(safe-area-inset-bottom));padding-left:max(var(--pad-inline),env(safe-area-inset-left))}
    .title-screen:before,.title-screen:after{content:"";position:absolute;pointer-events:none;border:1px solid rgba(47,115,246,.22);border-radius:50%}
    .title-screen:before{width:78vw;height:78vw;left:-42vw;top:18vh;background:radial-gradient(circle at 70% 30%,rgba(47,115,246,.18),transparent 68%)}
    .title-screen:after{width:92vw;height:92vw;right:-58vw;bottom:-18vh;background:radial-gradient(circle at 30% 30%,rgba(47,115,246,.14),transparent 68%)}
    .title-brand,.title-content,.title-meta{position:relative;z-index:1}
    .title-brand{display:flex;justify-content:center}.title-brand img{width:min(48vw,190px);height:auto}
    .title-content{text-align:center;display:grid;gap:clamp(18px,4dvh,28px);justify-items:center;width:100%;max-width:34rem;margin-inline:auto}
    .title-content h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.75rem,11.5vw,4.6rem);line-height:.9;letter-spacing:-.05em;margin:0;width:100%;max-width:100%;text-align:center}
    .title-line{display:block;white-space:nowrap;width:100%;text-align:center}.title-underline{position:relative;display:inline-block}.title-underline:after{content:"";position:absolute;left:-3%;right:-3%;bottom:-.18em;height:.12em;border-radius:50%;background:var(--fred-blue);transform:rotate(-2deg)}
    .title-kicker{margin:0;border:1px solid var(--fred-blue);border-radius:999px;padding:8px 16px;color:#D9E6FB;font-size:14px;font-weight:800;letter-spacing:.16em}
    .title-copy{max-width:28ch;margin:0;color:#D9E6FB;font-size:clamp(1rem,4.5vw,1.2rem)}
    .title-screen .actions{width:100%;max-width:30rem}.title-screen .button.primary{min-height:58px;font-size:1.05rem}
    .title-meta{height:1px}
    .hero-image{
      overflow:hidden;border-radius:20px;margin:0;width:100%;
      background:#D9E3EF;box-shadow:0 20px 60px rgba(0,0,0,.26);
      display:grid;
    }
    .hero-image img{width:100%;height:auto;object-fit:cover}
    .hero-badge{
      position:static;margin:0;padding:14px 16px;
      background:#203047;color:#fff;font-size:15px;font-weight:700;
      line-height:1.4;text-wrap:balance;
    }
    .button{
      min-height:52px;border:0;border-radius:12px;padding:12px 16px;
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      font-weight:800;cursor:pointer;text-decoration:none;
      transition:transform .12s ease,background .15s ease,opacity .15s ease;
    }
    .button:active:not(:disabled){transform:scale(.985)}
    .button.primary{background:var(--fred-blue-dark);color:#fff}
    .button.primary:hover{background:var(--fred-blue-dark)}
    .button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
    .button.ghost{background:transparent;color:var(--muted)}
    .button:disabled{opacity:.42;cursor:not-allowed}
    .actions{margin-top:auto;display:grid;gap:10px;padding-top:4px}
    .brief-list{display:grid;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .brief-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
    .brief-row:last-child{border-bottom:0}
    .brief-row strong{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .brief-row span{font-size:16px;font-weight:650}
    fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
    legend{padding:0;margin-bottom:14px}
    .choice-input{position:absolute;opacity:0;pointer-events:none}
    .choice{
      min-height:86px;padding:16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;
      display:grid;grid-template-columns:1fr 28px;gap:14px;align-items:center;cursor:pointer;
      box-shadow:0 3px 12px rgba(11,29,58,.04);
    }
    .choice-title{display:block;font-size:17px;font-weight:800;letter-spacing:-.015em}
    .choice-desc{display:block;margin-top:5px;font-size:15px;color:var(--muted);line-height:1.42}
    .choice-dot{width:22px;height:22px;border-radius:50%;border:2px solid #A9B8CB;display:grid;place-items:center}
    .choice-input:checked+.choice{border-color:var(--fred-blue);background:#F1F6FF;box-shadow:0 0 0 1px var(--fred-blue)}
    .choice-input:checked+.choice .choice-dot{border-color:var(--fred-blue)}
    .choice-input:checked+.choice .choice-dot:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--fred-blue)}
    .choice-input:focus-visible+.choice{outline:3px solid rgba(47,115,246,.42);outline-offset:3px}
    .decision-note{font-size:15px;color:var(--muted);margin-bottom:0}
    .market-shell{
      border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#FAFCFF;
      box-shadow:var(--shadow);width:100%;min-width:0;
      display:flex;flex-direction:column;
    }
    .market-top{background:var(--fred-navy);color:#fff;padding:14px 14px 16px;display:grid;gap:12px;flex:0 0 auto}
    .market-nav{display:flex;align-items:center;gap:10px}
    .market-mark{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--fred-navy);display:grid;place-items:center;font-weight:900}
    .market-name{font-size:17px;font-weight:850;letter-spacing:-.02em}
    .market-cart{position:relative;margin-left:auto;width:44px;height:44px;border:0;border-radius:12px;background:#173158;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
    .cart-count{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--fred-blue);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900;border:2px solid var(--fred-navy)}
    .searchbox{
      min-height:48px;background:#fff;border-radius:12px;display:flex;align-items:center;gap:9px;
      padding:0 13px;color:#53657D;font-size:15px
    }
    .searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:0}
    .searchbox input::placeholder{color:#53657D;opacity:1}
    .market-body{padding:clamp(12px,3.5vw,16px);display:grid;gap:clamp(12px,3.5vw,16px);min-width:0;overflow:visible}
    .market-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .market-meta h3{margin:0;font-size:21px}
    .market-meta span{font-size:14px;color:var(--muted)}
    .category-dropdown{position:relative}
    .category-select{
      width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer
    }
    .category-chevron{width:20px;height:20px;display:grid;place-items:center;flex:0 0 20px;transition:transform .15s ease}
    .category-select[aria-expanded="true"] .category-chevron{transform:rotate(180deg)}
    .category-menu{
      position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);padding:6px;border:1px solid var(--line);
      border-radius:12px;background:#fff;box-shadow:0 14px 34px rgba(11,29,58,.16);display:grid;gap:2px
    }
    .category-option{
      min-height:44px;border:0;border-radius:9px;background:#fff;color:var(--text);padding:9px 10px;text-align:left;font-size:15px;font-weight:650;cursor:pointer
    }
    .category-option:hover,.category-option[aria-selected="true"]{background:#F1F6FF;color:#174FAF}
    .product-detail{display:grid;gap:14px}
    .product-detail-back{min-height:44px;border:0;background:transparent;padding:6px 0;color:#315C94;text-align:left;font-size:14px;font-weight:800;cursor:pointer}
    .product-detail-image{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#EEF2F7}
    .product-detail-image img{width:100%;height:100%;object-fit:cover}
    .product-detail-head{display:grid;gap:5px}
    .product-detail-head h3{font-size:24px;margin:0}
    .product-detail-price{font-size:18px;font-weight:850}
    .product-detail-copy{font-size:15px;color:var(--muted);margin:0}
    .product-detail-cta{min-height:48px;border:0;border-radius:12px;background:var(--fred-blue-dark);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
    .cart-panel{display:grid;gap:14px}
    .cart-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .cart-head h3{margin:0}
    .cart-close{min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font-size:20px;cursor:pointer}
    .cart-items{display:grid;gap:10px}
    .cart-item{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
    .cart-item img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#EEF2F7}
    .cart-item strong,.cart-item span{display:block}
    .cart-item span{font-size:14px;color:var(--muted)}
    .cart-empty{margin:0;padding:18px;border:1px dashed #AFC4E0;border-radius:12px;background:#F4F8FE;color:var(--muted)}
    .empty-results{grid-column:1/-1;padding:20px;border:1px dashed #AFC4E0;border-radius:14px;background:#F4F8FE;color:var(--muted);text-align:center}
    .filter-block{display:grid;gap:10px}
    .filter-row{display:flex;gap:8px;flex-wrap:wrap}
    .filter-chip{
      min-height:44px;padding:10px 13px;border:1px solid #BCD0EE;border-radius:999px;background:#F2F7FF;
      color:#244A82;font-size:14px;font-weight:750;display:inline-flex;align-items:center;cursor:pointer
    }
    .filter-chip[aria-pressed="true"]{background:#DCEAFF;border-color:#7EA9E8;color:#174FAF;box-shadow:inset 0 0 0 1px #7EA9E8}
    .suggestion{
      width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);
      display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;text-align:left;cursor:pointer
    }
    .suggestion span{color:var(--muted);font-size:14px}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:clamp(8px,2.5vw,12px);min-width:0}
    .product-card{
      border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;min-width:0;
      display:grid;text-align:left;padding:0;color:var(--text);text-decoration:none;cursor:pointer
    }
    .product-image{aspect-ratio:1/1;background:#EEF2F7;overflow:hidden}
    .product-image img{width:100%;height:100%;object-fit:cover}
    .product-copy{padding:10px;display:grid;gap:4px}
    .product-copy strong{font-size:15px;line-height:1.25}
    .product-copy span{font-size:14px;color:var(--muted)}
    .product-link-hint{display:flex;align-items:center;gap:6px;color:#315C94!important;font-weight:700}
    .results-control{min-height:48px;border-top:1px solid var(--line);padding-top:12px}
    .pagination{display:flex;align-items:center;justify-content:center;gap:8px}
    .page-chip{min-width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--text);display:grid;place-items:center;font-size:14px;font-weight:800;cursor:pointer;padding:0}
    .page-chip.active{background:var(--fred-blue);border-color:var(--fred-blue);color:#fff}
    .infinite-note{min-height:48px;border:1px dashed #AFC4E0;border-radius:12px;background:#F4F8FE;padding:11px 12px;display:flex;align-items:center;gap:10px;font-size:14px;color:#355A8D}.infinite-note[data-loaded="true"]{border-style:solid;background:#EEF5FF}
    .build-callout{
      padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
      display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start
    }
    .build-index{width:34px;height:34px;border-radius:10px;background:#EAF2FF;color:#235BB1;display:grid;place-items:center;font-size:14px;font-weight:900;margin-top:1px}
    .build-copy{min-width:0}
    .build-copy strong{display:block;font-size:16px;line-height:1.25}
    .build-copy span{display:block;margin-top:4px;color:var(--muted);font-size:14px}
    .confidence-card{display:grid;gap:14px;padding:18px;border-radius:18px;background:#F3F7FD;border:1px solid var(--line)}
    .confidence-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
    .confidence-head strong{font-size:18px}
    .confidence-value{font-size:32px;font-weight:900;letter-spacing:-.04em;color:var(--fred-blue-dark)}
    input[type="range"]{width:100%;min-height:44px;accent-color:var(--fred-blue)}
    .range-labels{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
    .evidence-stack{display:grid;gap:12px}
    .evidence-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;gap:8px}
    .evidence-card.held{border-color:#B9DFC9;background:var(--success-bg)}
    .evidence-card.missed{border-color:#E9C3C6;background:var(--danger-bg)}
    .evidence-tag{display:inline-flex;align-items:center;justify-self:start;min-height:32px;padding:5px 9px;border-radius:999px;font-size:14px;font-weight:900;letter-spacing:.04em}
    .held .evidence-tag{background:#D6EFDF;color:var(--success)}
    .missed .evidence-tag{background:#F5D8DA;color:var(--danger)}
    .evidence-metric{font-size:30px;font-weight:900;letter-spacing:-.045em;line-height:1}
    .evidence-copy{margin:0;font-size:15px;color:#34485F}
    .source{font-size:14px;color:var(--muted);margin:0}
    .result-score{font-size:64px;line-height:.9;font-weight:900;letter-spacing:-.07em;color:var(--fred-blue)}
    .result-card{padding:18px;border-radius:18px;background:var(--fred-navy);color:#fff;display:grid;gap:12px}
    .result-card h2{margin:0;color:#fff}
    .result-card p{margin:0;color:#D7E5FA;font-size:16px}
    .workflow{
      display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
    }
    .workflow strong{font-size:18px}
    .workflow p{margin:0;color:var(--muted);font-size:15px}
    .hubspot-form-shell{display:grid;gap:10px}
    .hubspot-form-shell .eyebrow{margin:0}
    .hs-form-frame{width:100%;min-height:220px}
    .back-row{display:flex;justify-content:flex-start}
    .back-button{min-height:44px;border:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:14px;font-weight:800;cursor:pointer}
    @keyframes enter{from{transform:translateY(5px)}to{transform:none}}
    @media (min-width:700px){
      body{padding-block:clamp(20px,4dvh,32px)}
      .shell{min-height:calc(100dvh - clamp(40px,8dvh,64px));border-radius:28px;box-shadow:0 24px 70px rgba(11,29,58,.16)}
      body.title-active{padding:0}
      .shell.title-mode{min-height:100dvh;border-radius:0;box-shadow:none}
      .hero-screen{border-radius:24px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <main id="app"></main>

      }
      function mountHubSpotForm(){
        var frame=document.querySelector('.hs-form-frame[data-region="eu1"][data-form-id="95dea87f-7339-4308-9374-0e0c344b9cb7"][data-portal-id="146948896"]');
        if(!frame||frame.querySelector("iframe")){return;}
        var previous=document.querySelector('script[data-fred-hubspot-embed="true"]');
        if(previous){previous.remove();}
        var script=document.createElement("script");
        script.src="https://js-eu1.hsforms.net/forms/embed/146948896.js";
        script.defer=true;
        script.setAttribute("data-fred-hubspot-embed","true");
        document.head.appendChild(script);
      }
      function bind(){
        mountHubSpotForm();
        document.querySelectorAll("[data-action]").forEach(function(btn){
          btn.addEventListener("click",function(){act(btn.getAttribute("data-action"));});
        });
        document.querySelectorAll("[data-state-key]").forEach(function(input){
          input.addEventListener("change",function(e){
            var key=e.currentTarget.getAttribute("data-state-key");
            state[key]=e.currentTarget.value;
            if(key==="resultsMode"){state.infiniteBatch=0;state.currentPage=1;}
            if(key==="discovery"){
              state.dropdownOpen=false;
              state.categorySelection="All categories";
              state.query="";
              state.filterFurniture=false;
              state.filterUnder100=false;
              state.filterShips=false;
            }
            state.productDetail=null;
            state.cartOpen=false;
            state.marketScroll=0;
            render(false);
            requestAnimationFrame(function(){
              var selected=document.getElementById(key+"-"+state[key]);
              if(selected){selected.focus();}
            });
          });
        });
        var range=document.getElementById("confidence");
        if(range){
          range.addEventListener("input",function(e){
            state.confidence=Number(e.target.value);
            var out=document.getElementById("confidence-value");
            if(out){out.textContent=state.confidence+"%";}
          });
        }
        var market=document.querySelector(".market-shell");
        if(market){
          market.addEventListener("click",function(e){
            var card=e.target.closest(".product-card");
            if(card&&card.tagName==="BUTTON"){openProduct(card.getAttribute("data-product-id"));return;}
            if(card&&card.tagName==="A"){return;}
            var openCart=e.target.closest('[data-market-action="open-cart"]');
            if(openCart){state.cartOpen=true;state.productDetail=null;render(false);return;}
            var closeCart=e.target.closest('[data-market-action="close-cart"]');
            if(closeCart){state.cartOpen=false;render(false);return;}
            var addToBag=e.target.closest('[data-market-action="add-to-bag"]');
            if(addToBag){
              var productId=addToBag.getAttribute("data-product-id");
              if(productId&&!state.cartItems.includes(productId)){state.cartItems.push(productId);}
              render(false);
              return;
            }
            var homeLiving=e.target.closest('[data-market-action="home-living"]');
            if(homeLiving){
              state.filterFurniture=true;
              state.filterUnder100=false;
              state.filterShips=false;
              state.query="";
              state.currentPage=1;
              state.infiniteBatch=0;
              render(false);
              return;
            }
            var filter=e.target.closest("[data-filter]");
            if(filter){
              var filterKey=filter.getAttribute("data-filter");
              if(filterKey==="furniture"){state.filterFurniture=!state.filterFurniture;}
              if(filterKey==="under100"){state.filterUnder100=!state.filterUnder100;}
              if(filterKey==="ships"){state.filterShips=!state.filterShips;}
              state.currentPage=1;
              state.infiniteBatch=0;
              render(false);
              return;
            }
            var backToSearch=e.target.closest('[data-market-action="back-to-search"]');
            if(backToSearch){
              state.productDetail=null;
              render(false);
              requestAnimationFrame(function(){
                window.scrollTo({top:state.marketScroll||0,behavior:"auto"});
              });
              return;
            }
            var pageButton=e.target.closest("[data-page]");
            if(pageButton){
              state.currentPage=Number(pageButton.getAttribute("data-page"))||1;
              state.productDetail=null;
              state.marketScroll=0;
              render(false);
              requestAnimationFrame(function(){
                document.querySelector(".market-shell")?.scrollIntoView({block:"start",behavior:"auto"});
              });
              return;
            }
            var toggle=e.target.closest("[data-category-toggle]");
            if(toggle){
              state.dropdownOpen=!state.dropdownOpen;
              render(false);
              requestAnimationFrame(function(){document.querySelector("[data-category-toggle]")?.focus();});
              return;
            }
            var option=e.target.closest("[data-category-option]");
            if(option){
              state.categorySelection=option.getAttribute("data-category-option");
              state.dropdownOpen=false;
              state.currentPage=1;
              state.infiniteBatch=0;
              state.productDetail=null;
              state.marketScroll=0;
              render(false);
              requestAnimationFrame(function(){document.querySelector("[data-category-toggle]")?.focus();});
              return;
            }
          });
        }
        var search=document.querySelector("[data-market-search]");
        if(search){
          search.addEventListener("input",function(e){
            state.query=e.target.value;
            state.currentPage=1;
            state.infiniteBatch=0;
            render(false);
            requestAnimationFrame(function(){
              var next=document.querySelector("[data-market-search]");
              if(next){next.focus();next.setSelectionRange(next.value.length,next.value.length);}
            });
          });
        }
        observeInfiniteSentinel();
      }
      function act(action){
        if(action==="start"){state.step=1;}
        else if(action==="brief"){state.step=2;}
        else if(action==="next"){state.step=Math.min(9,state.step+1);}
        else if(action==="back"){state.step=Math.max(1,state.step-1);}
        else if(action==="lock"){state.revealStage=0;state.step=10;}
        else if(action==="reveal"){state.revealStage=Math.min(2,state.revealStage+1);}
        else if(action==="result"){state.step=11;}
        else if(action==="restart"){
          state={step:0,linkBehavior:null,resultsMode:null,discovery:null,confidence:75,revealStage:0,productDetail:null,dropdownOpen:false,categorySelection:"All categories",query:"",filterFurniture:false,filterUnder100:false,filterShips:false,currentPage:1,marketScroll:0,cartItems:[],cartOpen:false,infiniteBatch:0,externalProduct:null};
        }
        window.scrollTo({top:0,behavior:"auto"});
        render(true);
      }
      render(false);
    })();
  </script>
</body>
</html>
